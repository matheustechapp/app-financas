<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fluxo">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Fluxo — Controle Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1117;
  --bg2: #171b24;
  --bg3: #1e2330;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text: #f0f0f5;
  --text2: #8a8fa8;
  --text3: #555a70;
  --green: #2dca8c;
  --green-dim: rgba(45,202,140,0.12);
  --red: #ff5c5c;
  --red-dim: rgba(255,92,92,0.12);
  --accent: #5b8cff;
  --accent-dim: rgba(91,140,255,0.12);
  --amber: #ffb845;
  --amber-dim: rgba(255,184,69,0.12);
  --radius: 14px;
  --radius-sm: 8px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;overflow:hidden}

/* ── SCREENS ── */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transform:translateY(12px);transition:opacity .25s,transform .25s}
.screen.active{opacity:1;pointer-events:all;transform:none}

/* ── TOP BAR ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:52px 20px 16px;background:var(--bg)}
.topbar h1{font-size:22px;font-weight:800;letter-spacing:-0.5px}
.topbar .month-nav{display:flex;align-items:center;gap:4px}
.topbar .month-nav button{background:none;border:none;color:var(--text2);font-size:20px;padding:4px 8px;cursor:pointer;border-radius:var(--radius-sm)}
.topbar .month-nav button:active{background:var(--bg3)}
.topbar .month-label{font-size:14px;font-weight:600;color:var(--text);min-width:100px;text-align:center}

/* ── SCROLL AREA ── */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 120px}
.scroll::-webkit-scrollbar{display:none}

/* ── BALANCE HERO ── */
.balance-hero{padding:0 20px 24px;text-align:center}
.balance-hero .label{font-size:11px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;margin-bottom:6px;font-family:'DM Mono',monospace}
.balance-hero .value{font-size:40px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.balance-hero .value.positive{color:var(--text)}
.balance-hero .value.negative{color:var(--red)}
.balance-hero .sub{margin-top:8px;font-size:12px;color:var(--text3);font-family:'DM Mono',monospace}

/* ── SUMMARY CARDS ── */
.summary-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px 20px}
.summary-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.summary-card .sc-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px;font-family:'DM Mono',monospace}
.summary-card .sc-val{font-size:18px;font-weight:700;letter-spacing:-0.5px}
.summary-card.entrada .sc-val{color:var(--green)}
.summary-card.saida .sc-val{color:var(--red)}

/* ── CHART SECTION ── */
.chart-section{padding:0 20px 20px}
.section-label{font-size:11px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;margin-bottom:12px;font-family:'DM Mono',monospace}
.chart-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;overflow:hidden}
.donut-row{display:flex;align-items:center;gap:16px}
.donut-container{position:relative;width:110px;height:110px;flex-shrink:0}
.donut-container svg{width:110px;height:110px;transform:rotate(-90deg)}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-center .dc-pct{font-size:18px;font-weight:800;color:var(--text)}
.donut-center .dc-label{font-size:9px;color:var(--text3);letter-spacing:1px}
.legend{flex:1;display:flex;flex-direction:column;gap:8px}
.legend-item{display:flex;align-items:center;gap:8px;cursor:pointer}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.legend-name{font-size:12px;color:var(--text2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend-pct{font-size:12px;color:var(--text3);font-family:'DM Mono',monospace;flex-shrink:0}

/* ── METAS ── */
.metas-section{padding:0 20px 20px}
.meta-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
.meta-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.meta-name{font-size:14px;font-weight:600}
.meta-vals{font-size:12px;color:var(--text3);font-family:'DM Mono',monospace}
.meta-bar-bg{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
.meta-bar-fill{height:100%;border-radius:3px;transition:width .6s ease}
.meta-pct{font-size:11px;color:var(--text3);margin-top:6px;text-align:right;font-family:'DM Mono',monospace}
.add-meta-btn{width:100%;background:none;border:1px dashed var(--border2);border-radius:var(--radius);padding:12px;font-size:13px;color:var(--text3);cursor:pointer;font-family:'Syne',sans-serif;display:flex;align-items:center;justify-content:center;gap:6px}
.add-meta-btn:active{background:var(--bg2)}

/* ── LANCAMENTOS ── */
.lancamentos-section{padding:0 20px}
.filter-row{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.filter-row::-webkit-scrollbar{display:none}
.fbtn{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:none;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;font-family:'Syne',sans-serif;transition:all .15s}
.fbtn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.fbtn:active{opacity:.7}
.lanc-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.lanc-item:last-child{border-bottom:none}
.lanc-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.lanc-icon.entrada{background:var(--green-dim)}
.lanc-icon.saida{background:var(--red-dim)}
.lanc-body{flex:1;min-width:0}
.lanc-desc{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lanc-meta{font-size:11px;color:var(--text3);margin-top:2px;display:flex;gap:6px;flex-wrap:nowrap;overflow:hidden}
.lanc-tag{background:var(--bg3);border-radius:4px;padding:1px 5px;white-space:nowrap;font-family:'DM Mono',monospace}
.lanc-right{text-align:right;flex-shrink:0}
.lanc-val{font-size:14px;font-weight:700;font-family:'DM Mono',monospace}
.lanc-val.entrada{color:var(--green)}
.lanc-val.saida{color:var(--red)}
.lanc-date{font-size:11px;color:var(--text3);margin-top:2px;font-family:'DM Mono',monospace}
.empty-state{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-state .es-icon{font-size:36px;display:block;margin-bottom:10px}
.empty-state p{font-size:14px}

/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,17,23,0.95);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;padding:8px 0 calc(8px + var(--safe-bottom));z-index:100}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;color:var(--text3);font-family:'Syne',sans-serif;padding:6px 0}
.nav-btn.active{color:var(--accent)}
.nav-btn svg{width:22px;height:22px}
.nav-btn span{font-size:10px;font-weight:600;letter-spacing:.5px}

/* ── FAB ── */
.fab{position:fixed;bottom:calc(72px + var(--safe-bottom));right:20px;width:56px;height:56px;background:var(--accent);border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:99;box-shadow:0 4px 20px rgba(91,140,255,0.4)}
.fab svg{width:24px;height:24px;color:#fff}
.fab:active{transform:scale(.94)}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-bg.open{opacity:1;pointer-events:all}
.modal{background:var(--bg2);border-radius:24px 24px 0 0;padding:20px 20px calc(28px + var(--safe-bottom));width:100%;max-width:480px;transform:translateY(30px);transition:transform .25s;max-height:92vh;overflow-y:auto}
.modal-bg.open .modal{transform:none}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 20px}
.modal-title{font-size:20px;font-weight:800;margin-bottom:18px;letter-spacing:-0.5px}
.type-toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.ttbtn{padding:11px;border-radius:var(--radius);border:1px solid var(--border2);background:none;cursor:pointer;font-size:13px;font-weight:600;font-family:'Syne',sans-serif;color:var(--text2);display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}
.ttbtn.active-e{background:var(--green-dim);border-color:var(--green);color:var(--green)}
.ttbtn.active-s{background:var(--red-dim);border-color:var(--red);color:var(--red)}
.field{margin-bottom:14px}
.field label{font-size:11px;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;display:block;margin-bottom:6px;font-family:'DM Mono',monospace}
.field input,.field select,.field textarea{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:11px 14px;font-size:15px;font-family:'Syne',sans-serif;color:var(--text);outline:none}
.field input:focus,.field select:focus{border-color:var(--accent)}
.field select{appearance:none;-webkit-appearance:none}
.field textarea{resize:none;height:70px;font-size:14px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.recorrente-row{display:flex;align-items:center;justify-content:space-between;background:var(--bg3);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:14px}
.recorrente-row span{font-size:14px;font-weight:500}
.toggle{width:44px;height:24px;background:var(--bg);border-radius:12px;position:relative;cursor:pointer;border:1px solid var(--border2);transition:background .2s}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle.on::after{transform:translateX(20px)}
.modal-actions{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:6px}
.btn-cancel{background:none;border:1px solid var(--border2);border-radius:var(--radius);padding:14px;font-size:14px;font-weight:600;font-family:'Syne',sans-serif;color:var(--text2);cursor:pointer}
.btn-save{background:var(--accent);border:none;border-radius:var(--radius);padding:14px;font-size:14px;font-weight:700;font-family:'Syne',sans-serif;color:#fff;cursor:pointer}
.btn-save:active{opacity:.85}

/* ── META MODAL ── */
.meta-color-row{display:flex;gap:8px;flex-wrap:wrap}
.color-opt{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:border-color .15s}
.color-opt.sel{border-color:#fff}

/* ── SETTINGS SCREEN ── */
.settings-wrap{padding:0 20px 20px}
.settings-section{margin-bottom:24px}
.settings-section h3{font-size:11px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;margin-bottom:12px;font-family:'DM Mono',monospace}
.setting-row{display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px}
.setting-row .sr-label{font-size:14px;font-weight:500}
.setting-row .sr-sub{font-size:12px;color:var(--text3);margin-top:2px}
.export-btn{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;font-size:14px;font-weight:600;font-family:'Syne',sans-serif;color:var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px}
.export-btn:active{background:var(--bg3)}
.danger-btn{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;font-size:14px;font-weight:600;font-family:'Syne',sans-serif;color:var(--red);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}

/* ── TOAST ── */
.toast{position:fixed;bottom:calc(90px + var(--safe-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg3);border:1px solid var(--border2);border-radius:50px;padding:10px 20px;font-size:13px;font-weight:600;color:var(--text);z-index:300;opacity:0;transition:all .25s;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── ANIMATION ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lanc-item{animation:fadeUp .2s ease both}
</style>
</head>
<body>

<!-- SCREEN: HOME -->
<div class="screen active" id="screen-home">
  <div class="topbar">
    <div class="month-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <span class="month-label" id="monthLabel">–</span>
      <button onclick="changeMonth(1)">›</button>
    </div>
    <h1>fluxo</h1>
    <div style="width:80px;display:flex;justify-content:flex-end">
      <span id="lanc-count" style="font-size:12px;color:var(--text3);font-family:'DM Mono',monospace"></span>
    </div>
  </div>
  <div class="scroll">
    <div class="balance-hero">
      <div class="label">saldo do mês</div>
      <div class="balance-value value" id="balanceVal">R$ 0</div>
      <div class="sub" id="balanceSub"></div>
    </div>
    <div class="summary-row">
      <div class="summary-card entrada">
        <div class="sc-label">Entradas</div>
        <div class="sc-val" id="totalEntradas">R$ 0</div>
      </div>
      <div class="summary-card saida">
        <div class="sc-label">Saídas</div>
        <div class="sc-val" id="totalSaidas">R$ 0</div>
      </div>
    </div>
    <div class="chart-section" id="chartSection">
      <div class="section-label">gastos por categoria</div>
      <div class="chart-wrap">
        <div class="donut-row">
          <div class="donut-container">
            <svg viewBox="0 0 110 110"><circle cx="55" cy="55" r="45" fill="none" stroke="var(--bg3)" stroke-width="12"/></svg>
            <div id="donutSvg" style="position:absolute;inset:0"></div>
            <div class="donut-center"><span class="dc-pct" id="donutPct">0%</span><span class="dc-label">SAÍDAS</span></div>
          </div>
          <div class="legend" id="chartLegend"></div>
        </div>
      </div>
    </div>
    <div class="lancamentos-section">
      <div class="section-label">lançamentos</div>
      <div class="filter-row">
        <button class="fbtn active" onclick="setFilter('todos',this)">Todos</button>
        <button class="fbtn" onclick="setFilter('entrada',this)">Entradas</button>
        <button class="fbtn" onclick="setFilter('saida',this)">Saídas</button>
      </div>
      <div id="listContainer"></div>
    </div>
  </div>
</div>

<!-- SCREEN: METAS -->
<div class="screen" id="screen-metas">
  <div class="topbar">
    <h1>metas</h1>
    <div class="month-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <span class="month-label" id="monthLabel2">–</span>
      <button onclick="changeMonth(1)">›</button>
    </div>
  </div>
  <div class="scroll">
    <div class="metas-section" id="metasContainer">
    </div>
  </div>
</div>

<!-- SCREEN: SETTINGS -->
<div class="screen" id="screen-settings">
  <div class="topbar"><h1>config</h1></div>
  <div class="scroll">
    <div class="settings-wrap">
      <div class="settings-section">
        <h3>Dados</h3>
        <button class="export-btn" onclick="exportCSV()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Exportar CSV (Excel/Sheets)
        </button>
        <button class="export-btn" onclick="importarPlanilha()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Importar CSV
        </button>
        <input type="file" id="importInput" accept=".csv" style="display:none" onchange="handleImport(event)">
      </div>
      <div class="settings-section">
        <h3>Categorias</h3>
        <div id="catList" style="display:flex;flex-wrap:wrap;gap:6px"></div>
      </div>
      <div class="settings-section">
        <h3>Formas de Pagamento</h3>
        <div id="pgtoList" style="display:flex;flex-wrap:wrap;gap:6px"></div>
      </div>
      <div class="settings-section">
        <h3>Perigo</h3>
        <button class="danger-btn" onclick="clearAll()">Apagar todos os dados</button>
      </div>
      <div style="text-align:center;padding:20px 0;font-size:11px;color:var(--text3);font-family:'DM Mono',monospace">fluxo v1.0 — dados salvos localmente</div>
    </div>
  </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-btn active" id="nav-home" onclick="goTo('home')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>
    <span>Início</span>
  </button>
  <button class="nav-btn" id="nav-metas" onclick="goTo('metas')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><line x1="12" y1="3" x2="12" y2="1"/></svg>
    <span>Metas</span>
  </button>
  <button class="nav-btn" id="nav-settings" onclick="goTo('settings')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span>Config</span>
  </button>
</nav>

<!-- FAB -->
<button class="fab" onclick="openModal()" id="fab">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<!-- MODAL: NOVO LANÇAMENTO -->
<div class="modal-bg" id="modalBg" onclick="closeOnBg(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle">Novo Lançamento</div>
    <div class="type-toggle">
      <button class="ttbtn active-e" id="btnE" onclick="setType('entrada')">↓ Entrada</button>
      <button class="ttbtn" id="btnS" onclick="setType('saida')">↑ Saída</button>
    </div>
    <div class="field">
      <label>Descrição</label>
      <input type="text" id="fDesc" placeholder="Ex: Salário, Supermercado...">
    </div>
    <div class="field">
      <label>Detalhamento (opcional)</label>
      <input type="text" id="fDetalhe" placeholder="Ex: Parcela 01 de 06">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Valor (R$)</label>
        <input type="number" id="fVal" placeholder="0,00" min="0" step="0.01" inputmode="decimal">
      </div>
      <div class="field">
        <label>Data</label>
        <input type="date" id="fData">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Categoria</label>
        <select id="fCat"></select>
      </div>
      <div class="field">
        <label>Forma Pgt.</label>
        <select id="fPgto"></select>
      </div>
    </div>
    <div class="field">
      <label>Responsável (opcional)</label>
      <input type="text" id="fResp" placeholder="Ex: Débito, Família Brenda...">
    </div>
    <div class="recorrente-row">
      <div>
        <span>Lançamento recorrente</span>
        <div style="font-size:11px;color:var(--text3);margin-top:2px">Repetir todo mês automaticamente</div>
      </div>
      <div class="toggle" id="toggleRec" onclick="this.classList.toggle('on')"></div>
    </div>
    <input type="hidden" id="editId">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="salvar()">Salvar Lançamento</button>
    </div>
  </div>
</div>

<!-- MODAL: META -->
<div class="modal-bg" id="metaModalBg" onclick="closeMetaOnBg(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Nova Meta</div>
    <div class="field">
      <label>Nome da Meta</label>
      <input type="text" id="mNome" placeholder="Ex: Economizar em Alimentação">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Limite (R$)</label>
        <input type="number" id="mLimite" placeholder="1500" inputmode="decimal">
      </div>
      <div class="field">
        <label>Categoria</label>
        <select id="mCat"></select>
      </div>
    </div>
    <div class="field">
      <label>Cor</label>
      <div class="meta-color-row" id="metaColors"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeMetaModal()">Cancelar</button>
      <button class="btn-save" onclick="salvarMeta()">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── DATA ───────────────────────────────────────────────────
const CATS_SAIDA = ['Alimentação - Necessidade','Alimentação - Saídas','Mercantil','Saúde','Assinaturas','Impostos','Custo fixo','Carro - Transporte','Casa','Presentes','Viagem','Estudos/Capacitação','Gastos Extras','Gastos dos Outros','Compras Pessoais','Comunidade','Maria Áurea','Doce Áurea','Outros'];
const CATS_ENTRADA = ['Fatura','Salário','Freelance','Investimentos','Reembolso','Outros'];
const PGTOS = ['C6','Inter','XP','TAP','Nubank','Débito','Crédito','Dinheiro','Pix','Outros'];
const META_COLORS = ['#5b8cff','#2dca8c','#ff5c5c','#ffb845','#a78bfa','#f472b6','#34d399','#fb923c'];

let data = JSON.parse(localStorage.getItem('fluxo_data') || '[]');
let metas = JSON.parse(localStorage.getItem('fluxo_metas') || '[]');
let recorrentes = JSON.parse(localStorage.getItem('fluxo_rec') || '[]');
let currentMonth = new Date().getMonth();
let currentYear = new Date().getFullYear();
let currentFilter = 'todos';
let currentType = 'entrada';
let currentScreen = 'home';
let selectedMetaColor = META_COLORS[0];

const months = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function fmt(v){ return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function fmtDate(str){ if(!str) return ''; const p=str.split('-'); return `${p[2]}/${p[1]}`; }
function getKey(){ return `${currentMonth}-${currentYear}`; }
function getItems(){ return data.filter(i=>i.month===currentMonth&&i.year===currentYear); }

// ─── RENDER ─────────────────────────────────────────────────
function render(){
  const items = getItems();
  const ent = items.filter(i=>i.tipo==='entrada').reduce((a,i)=>a+i.valor,0);
  const sai = items.filter(i=>i.tipo==='saida').reduce((a,i)=>a+i.valor,0);
  const bal = ent - sai;

  document.getElementById('monthLabel').textContent = `${months[currentMonth]} ${currentYear}`;
  document.getElementById('monthLabel2').textContent = `${months[currentMonth]} ${currentYear}`;
  document.getElementById('totalEntradas').textContent = fmt(ent);
  document.getElementById('totalSaidas').textContent = fmt(sai);
  document.getElementById('lanc-count').textContent = `${items.length} itens`;

  const bv = document.getElementById('balanceVal');
  bv.textContent = fmt(bal);
  bv.className = 'value ' + (bal >= 0 ? 'positive' : 'negative');
  document.getElementById('balanceSub').textContent = ent>0 ? `${Math.round((sai/ent)*100)}% das entradas gastas` : '';

  renderChart(items);
  renderList(items);
  renderMetas(items);
  renderSettings();
}

// ─── CHART ──────────────────────────────────────────────────
function renderChart(items){
  const saidas = items.filter(i=>i.tipo==='saida');
  const total = saidas.reduce((a,i)=>a+i.valor,0);
  const bycat = {};
  saidas.forEach(i=>{ bycat[i.categoria]=(bycat[i.categoria]||0)+i.valor; });
  const sorted = Object.entries(bycat).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const R=45, cx=55, cy=55, circ=2*Math.PI*R;
  const palette=['#5b8cff','#2dca8c','#ffb845','#ff5c5c','#a78bfa','#f472b6'];
  let offset=0, paths='';
  sorted.forEach(([cat,val],i)=>{
    const pct=val/total, dash=pct*circ;
    paths+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${palette[i]}" stroke-width="12" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-offset}" style="transition:stroke-dasharray .5s"/>`;
    offset+=dash;
  });
  document.getElementById('donutSvg').innerHTML = `<svg viewBox="0 0 110 110" width="110" height="110" style="transform:rotate(-90deg)">${paths||'<circle cx="55" cy="55" r="45" fill="none" stroke="var(--bg3)" stroke-width="12"/>'}</svg>`;
  document.getElementById('donutPct').textContent = total>0?fmt(total).replace('R$\u00a0','R$\n'):'';

  const leg = document.getElementById('chartLegend');
  leg.innerHTML = sorted.map(([cat,val],i)=>`
    <div class="legend-item">
      <div class="legend-dot" style="background:${palette[i]}"></div>
      <span class="legend-name">${cat}</span>
      <span class="legend-pct">${Math.round((val/total)*100)}%</span>
    </div>`).join('');
}

// ─── LIST ────────────────────────────────────────────────────
function renderList(items){
  const filtered = currentFilter==='todos' ? items : items.filter(i=>i.tipo===currentFilter);
  const sorted = [...filtered].sort((a,b)=>new Date(b.data||'2000-01-01')-new Date(a.data||'2000-01-01'));
  const icons = {
    'Alimentação - Necessidade':'🍽','Alimentação - Saídas':'🍔','Mercantil':'🛒','Saúde':'💊','Assinaturas':'📱',
    'Impostos':'🏛','Custo fixo':'🔒','Carro - Transporte':'🚗','Casa':'🏠','Presentes':'🎁','Viagem':'✈️',
    'Estudos/Capacitação':'📚','Gastos Extras':'💸','Gastos dos Outros':'👥','Compras Pessoais':'🛍',
    'Comunidade':'🤝','Maria Áurea':'👶','Doce Áurea':'🍫','Salário':'💼','Freelance':'💻',
    'Investimentos':'📈','Fatura':'💳','Reembolso':'↩️','Outros':'📌'
  };
  const c = document.getElementById('listContainer');
  if(!sorted.length){ c.innerHTML='<div class="empty-state"><span class="es-icon">📭</span><p>Nenhum lançamento</p></div>'; return; }
  c.innerHTML = sorted.map((i,idx)=>`
    <div class="lanc-item" style="animation-delay:${idx*20}ms" onclick="editItem('${i.id}')">
      <div class="lanc-icon ${i.tipo}">${icons[i.categoria]||'📌'}</div>
      <div class="lanc-body">
        <div class="lanc-desc">${i.descricao}</div>
        <div class="lanc-meta">
          <span class="lanc-tag">${i.categoria}</span>
          ${i.formaPgto?`<span class="lanc-tag">${i.formaPgto}</span>`:''}
          ${i.recorrente?'<span class="lanc-tag">🔄</span>':''}
        </div>
      </div>
      <div class="lanc-right">
        <div class="lanc-val ${i.tipo}">${i.tipo==='entrada'?'+':'-'}${fmt(i.valor)}</div>
        <div class="lanc-date">${fmtDate(i.data)}</div>
      </div>
    </div>`).join('');
}

// ─── METAS ───────────────────────────────────────────────────
function renderMetas(items){
  const c = document.getElementById('metasContainer');
  const saidas = items.filter(i=>i.tipo==='saida');
  let html = '';
  metas.forEach(m=>{
    const gasto = saidas.filter(i=>i.categoria===m.categoria).reduce((a,i)=>a+i.valor,0);
    const pct = m.limite>0 ? Math.min((gasto/m.limite)*100,100) : 0;
    const color = pct>=100?'var(--red)':pct>=80?'var(--amber)':m.cor||'var(--green)';
    html += `<div class="meta-card">
      <div class="meta-header">
        <span class="meta-name">${m.nome}</span>
        <span class="meta-vals" style="font-size:11px">${fmt(gasto)} / ${fmt(m.limite)}</span>
      </div>
      <div class="meta-bar-bg"><div class="meta-bar-fill" style="width:${pct}%;background:${color}"></div></div>
      <div class="meta-pct" style="color:${color}">${Math.round(pct)}%</div>
    </div>`;
  });
  html += `<div style="padding:0 0 8px"><button class="add-meta-btn" onclick="openMetaModal()">+ Adicionar meta</button></div>`;
  c.innerHTML = html;
}

// ─── SETTINGS ────────────────────────────────────────────────
function renderSettings(){
  const cats = [...new Set([...CATS_SAIDA,...CATS_ENTRADA])];
  document.getElementById('catList').innerHTML = cats.map(c=>`<span style="background:var(--bg3);border-radius:6px;padding:4px 10px;font-size:12px;color:var(--text2);font-family:'DM Mono',monospace">${c}</span>`).join('');
  document.getElementById('pgtoList').innerHTML = PGTOS.map(p=>`<span style="background:var(--bg3);border-radius:6px;padding:4px 10px;font-size:12px;color:var(--text2);font-family:'DM Mono',monospace">${p}</span>`).join('');
}

// ─── NAVIGATION ─────────────────────────────────────────────
function goTo(screen){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+screen).classList.add('active');
  document.getElementById('nav-'+screen)?.classList.add('active');
  document.getElementById('fab').style.display = screen==='home'?'flex':'none';
  currentScreen = screen;
  render();
}

function changeMonth(d){
  currentMonth+=d;
  if(currentMonth>11){currentMonth=0;currentYear++;}
  if(currentMonth<0){currentMonth=11;currentYear--;}
  applyRecorrentes();
  render();
}

// ─── RECORRENTES ─────────────────────────────────────────────
function applyRecorrentes(){
  recorrentes.forEach(r=>{
    const exists = data.find(d=>d.recId===r.id&&d.month===currentMonth&&d.year===currentYear);
    if(!exists){
      const novo = {...r, id:Date.now()+'_'+Math.random(), recId:r.id, month:currentMonth, year:currentYear, data:`${currentYear}-${String(currentMonth+1).padStart(2,'0')}-01`};
      data.push(novo);
    }
  });
  save();
}

// ─── MODAL ───────────────────────────────────────────────────
function openModal(){
  document.getElementById('editId').value='';
  document.getElementById('modalTitle').textContent='Novo Lançamento';
  document.getElementById('fDesc').value='';
  document.getElementById('fDetalhe').value='';
  document.getElementById('fVal').value='';
  document.getElementById('fResp').value='';
  document.getElementById('toggleRec').classList.remove('on');
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('fData').value=today;
  setType('saida');
  populateSelects();
  document.getElementById('modalBg').classList.add('open');
  setTimeout(()=>document.getElementById('fDesc').focus(),300);
}

function editItem(id){
  const item = data.find(i=>i.id===id);
  if(!item) return;
  document.getElementById('editId').value=id;
  document.getElementById('modalTitle').textContent='Editar Lançamento';
  document.getElementById('fDesc').value=item.descricao;
  document.getElementById('fDetalhe').value=item.detalhamento||'';
  document.getElementById('fVal').value=item.valor;
  document.getElementById('fData').value=item.data||'';
  document.getElementById('fResp').value=item.responsavel||'';
  if(item.recorrente) document.getElementById('toggleRec').classList.add('on');
  else document.getElementById('toggleRec').classList.remove('on');
  setType(item.tipo);
  populateSelects(item.categoria, item.formaPgto);
  document.getElementById('modalBg').classList.add('open');
}

function populateSelects(selCat, selPgto){
  const cats = currentType==='entrada'?CATS_ENTRADA:CATS_SAIDA;
  document.getElementById('fCat').innerHTML = cats.map(c=>`<option${c===selCat?' selected':''}>${c}</option>`).join('');
  document.getElementById('fPgto').innerHTML = PGTOS.map(p=>`<option${p===selPgto?' selected':''}>${p}</option>`).join('');
}

function setType(t){
  currentType=t;
  document.getElementById('btnE').className='ttbtn'+(t==='entrada'?' active-e':'');
  document.getElementById('btnS').className='ttbtn'+(t==='saida'?' active-s':'');
  populateSelects();
}

function closeModal(){ document.getElementById('modalBg').classList.remove('open'); }
function closeOnBg(e){ if(e.target===document.getElementById('modalBg')) closeModal(); }

function salvar(){
  const desc = document.getElementById('fDesc').value.trim();
  const val = parseFloat(document.getElementById('fVal').value);
  if(!desc||!val||val<=0){ showToast('Preencha descrição e valor'); return; }
  const isRec = document.getElementById('toggleRec').classList.contains('on');
  const editId = document.getElementById('editId').value;
  const item = {
    id: editId||Date.now().toString(),
    tipo: currentType,
    descricao: desc,
    detalhamento: document.getElementById('fDetalhe').value.trim(),
    valor: parseFloat(val.toFixed(2)),
    data: document.getElementById('fData').value,
    categoria: document.getElementById('fCat').value,
    formaPgto: document.getElementById('fPgto').value,
    responsavel: document.getElementById('fResp').value.trim(),
    recorrente: isRec,
    month: currentMonth,
    year: currentYear,
  };
  if(editId){ data = data.map(i=>i.id===editId?item:i); }
  else { data.push(item); }
  if(isRec&&!editId){
    const rec = {...item, id:'rec_'+Date.now()};
    recorrentes.push(rec);
    item.recId=rec.id;
    localStorage.setItem('fluxo_rec',JSON.stringify(recorrentes));
  }
  save();
  closeModal();
  render();
  showToast(editId?'Lançamento atualizado!':'Lançamento salvo!');
}

// ─── META MODAL ─────────────────────────────────────────────
function openMetaModal(){
  document.getElementById('mNome').value='';
  document.getElementById('mLimite').value='';
  document.getElementById('mCat').innerHTML = CATS_SAIDA.map(c=>`<option>${c}</option>`).join('');
  const cr = document.getElementById('metaColors');
  cr.innerHTML = META_COLORS.map(c=>`<div class="color-opt${c===selectedMetaColor?' sel':''}" style="background:${c}" onclick="selectMetaColor('${c}',this)"></div>`).join('');
  document.getElementById('metaModalBg').classList.add('open');
}
function selectMetaColor(c,el){
  selectedMetaColor=c;
  document.querySelectorAll('.color-opt').forEach(o=>o.classList.remove('sel'));
  el.classList.add('sel');
}
function closeMetaModal(){ document.getElementById('metaModalBg').classList.remove('open'); }
function closeMetaOnBg(e){ if(e.target===document.getElementById('metaModalBg')) closeMetaModal(); }
function salvarMeta(){
  const nome=document.getElementById('mNome').value.trim();
  const lim=parseFloat(document.getElementById('mLimite').value);
  if(!nome||!lim){ showToast('Preencha nome e limite'); return; }
  metas.push({id:Date.now().toString(),nome,limite:lim,categoria:document.getElementById('mCat').value,cor:selectedMetaColor});
  localStorage.setItem('fluxo_metas',JSON.stringify(metas));
  closeMetaModal();
  render();
  showToast('Meta criada!');
}

// ─── FILTER ─────────────────────────────────────────────────
function setFilter(f,btn){
  currentFilter=f;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

// ─── EXPORT ─────────────────────────────────────────────────
function exportCSV(){
  const header='Data\tFatura\tMês da Fatura\tDescrição\tDetalhamento\tCategoria\tResponsável\tForma Pgt.\tClassificação\tValor\n';
  const rows = data.map(i=>{
    const d=i.data?new Date(i.data):new Date();
    const mes=`${d.getMonth()+1}. ${months[d.getMonth()]}`;
    return [i.data||'',i.month+1,mes,i.descricao,i.detalhamento||'',i.categoria,i.responsavel||'',i.formaPgto,i.tipo==='entrada'?'Entrada':'Saída',i.valor.toFixed(2).replace('.',',')].join('\t');
  }).join('\n');
  const blob=new Blob(['\uFEFF'+header+rows],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`fluxo_${new Date().toISOString().split('T')[0]}.csv`;
  a.click();URL.revokeObjectURL(url);
  showToast('CSV exportado!');
}

function importarPlanilha(){ document.getElementById('importInput').click(); }
function handleImport(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const lines=ev.target.result.split('\n').slice(1);
    let count=0;
    lines.forEach(l=>{
      const cols=l.split('\t');
      if(cols.length<9) return;
      const [dt,,mesStr,desc,det,cat,resp,pgto,classif,val]=cols;
      const valor=parseFloat((val||'0').replace(',','.'));
      if(!desc||!valor) return;
      const d=new Date(dt||Date.now());
      const mesMatch=mesStr?mesStr.match(/(\d+)\./):null;
      const month=mesMatch?parseInt(mesMatch[1])-1:d.getMonth();
      const year=d.getFullYear()||currentYear;
      data.push({id:Date.now()+'_'+count,tipo:classif?.trim().toLowerCase()==='entrada'?'entrada':'saida',descricao:desc.trim(),detalhamento:det?.trim()||'',valor,data:dt||'',categoria:cat?.trim()||'Outros',responsavel:resp?.trim()||'',formaPgto:pgto?.trim()||'',month,year,recorrente:false});
      count++;
    });
    save();render();
    showToast(`${count} lançamentos importados!`);
  };
  reader.readAsText(file,'UTF-8');
  e.target.value='';
}

function clearAll(){
  if(!confirm('Apagar TODOS os dados? Esta ação não pode ser desfeita.')) return;
  data=[];metas=[];recorrentes=[];
  localStorage.removeItem('fluxo_data');
  localStorage.removeItem('fluxo_metas');
  localStorage.removeItem('fluxo_rec');
  render();showToast('Dados apagados');
}

// ─── PERSISTENCE ─────────────────────────────────────────────
function save(){ localStorage.setItem('fluxo_data',JSON.stringify(data)); }

// ─── TOAST ───────────────────────────────────────────────────
let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2500);
}

// ─── INIT ────────────────────────────────────────────────────
applyRecorrentes();
render();
</script>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
